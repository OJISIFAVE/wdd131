<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Review Form</title>
    <meta name="author" content="God'sfavour Ojisi">
    <meta name="description" content="Product review form">

    <link rel="stylesheet" href="styles/form.css">
    <script src="scripts/form.js" defer></script>
</head>

<body>
    <header>
        <h1>Product Review</h1>
    </header>

    <main>
        <form method="get" action="review.html">

            <label for="productName">Product Name</label>
            <select id="productName" name="productName" required>
                <option value="" disabled selected>Select a Product ...</option>
            </select>

            <fieldset>
                <legend>Overall Rating</legend>

                <label>
                    <input type="radio" id="rating1" name="rating" value="1" required>
                    ☆
                </label>

                <label>
                    <input type="radio" id="rating2" name="rating" value="2">
                    ☆☆
                </label>

                <label>
                    <input type="radio" id="rating3" name="rating" value="3">
                    ☆☆☆
                </label>

                <label>
                    <input type="radio" id="rating4" name="rating" value="4">
                    ☆☆☆☆
                </label>

                <label>
                    <input type="radio" id="rating5" name="rating" value="5">
                    ☆☆☆☆☆
                </label>
            </fieldset>


            <label for="installDate">Date of Installation</label>
            <input type="date" id="installDate" name="installDate" required>


            <fieldset>
                <legend>Useful Features</legend>

                <label>
                    <input type="checkbox" id="feature1" name="features" value="easy">
                    Easy to Use
                </label>

                <label>
                    <input type="checkbox" id="feature2" name="features" value="durable">
                    Durable
                </label>

                <label>
                    <input type="checkbox" id="feature3" name="features" value="design">
                    Good Design
                </label>

                <label>
                    <input type="checkbox" id="feature4" name="features" value="quality">
                    High Quality
                </label>
            </fieldset>


            <label for="review">Written Review</label>
            <textarea id="review" name="review"></textarea>


            <label for="userName">User Name</label>
            <input type="text" id="userName" name="userName">


            <input type="submit" value="Submit Review">

        </form>
    </main>


    <footer>
        <p>
            © 2026 God'sfavour Ojisi | WDD131
        </p>
    </footer>

</body>

</html>
